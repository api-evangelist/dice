aid: dice
name: DICE
description: 'DICE is a mobile-first live events discovery and ticketing platform founded in London in 2014
  by Phil Hutcheon. Through the DICE app (iOS and Android) and dice.fm, fans discover concerts, club nights,
  festivals, tours and livestreams, buy fee-transparent tickets that live securely in-app, join waiting lists
  for sold-out shows, and resell tickets at face value to curb touting. DICE also runs a partner business
  serving venues, promoters, artists and festivals with tools to reach fans, sell tickets and grow their
  audiences, and owns the Boiler Room brand. Backed by SoftBank Vision Fund, DICE operates across the UK,
  Europe and the US. DICE publishes no public developer API; this profile captures the company''s public
  web, security and legal surface.'
